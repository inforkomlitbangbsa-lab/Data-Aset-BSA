<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMAG - GPIB Betlehem Sungai Ambawang</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0A192F; color: #E6F1FF; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-custom { background-color: #112240; border: 1px solid #233554; border-radius: 12px; }
    .navbar-custom { background-color: #020C1B; border-bottom: 2px solid #D4AF37; }
    .btn-gold { background-color: #D4AF37; color: #0A192F; font-weight: bold; }
    .btn-gold:hover { background-color: #B59228; color: #fff; }
    .text-gold { color: #D4AF37; }
  </style>
</head>
<body>

  <!-- Navbar Header dengan Logo Gereja -->
  <nav class="navbar navbar-custom px-3 py-2">
    <div class="container-fluid d-flex align-items-center">
      <!-- Ubah src logo dengan file URL logo GPIB yang valid -->
      <img src="logo_gpib.png" alt="GPIB Logo" width="45" class="me-3">
      <div>
        <h6 class="m-0 fw-bold text-white">GPIB JEMAAT BETLEHEM SUNGAI AMBAWANG</h6>
        <small class="text-gold">Sistem Informasi Manajemen Aset Gereja (BSA)</small>
      </div>
    </div>
  </nav>

  <!-- Container Utama -->
  <div class="container mt-4 mb-5">
    
    <!-- Dashboard Ringkasan -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="card card-custom p-3 text-center">
          <small class="text-muted">Total Aset</small>
          <h3 class="text-gold m-0" id="totalAset">0</h3>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card card-custom p-3 text-center">
          <small class="text-muted">Kondisi Baik</small>
          <h3 class="text-success m-0" id="baikAset">0</h3>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card card-custom p-3 text-center">
          <small class="text-muted">Perlu Servis</small>
          <h3 class="text-warning m-0" id="servisAset">0</h3>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card card-custom p-3 text-center">
          <small class="text-muted">Rusak Berat</small>
          <h3 class="text-danger m-0" id="rusakAset">0</h3>
        </div>
      </div>
    </div>

    <!-- Form Input Aset (Optimasi HP) -->
    <div class="card card-custom p-4">
      <h5 class="text-gold mb-3"><i class="bi bi-plus-circle"></i> Input Inventaris Aset Baru</h5>
      <form id="formAset">
        
        <div class="mb-3">
          <label class="form-label">Nama Barang</label>
          <input type="text" class="form-control bg-dark text-white border-secondary" id="namaBarang" placeholder="Contoh: Mic Wireless Aslley" required>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label">Lokasi Pos</label>
            <select class="form-select bg-dark text-white border-secondary" id="lokasi" required>
              <option value="IND">IND - Induk</option>
              <option value="DAP">DAP - Dango Anugerah Penapat</option>
              <option value="MIS">MIS - Menara Iman Siak</option>
              <option value="PND">PND - Penabur Durian</option>
              <option value="TJP">TJP - Tuah Jubata Sei. Pelaik</option>
              <option value="SHB">SHB - Sahabat Berinang</option>
              <option value="IMB">IMB - Imanuel Bengkarek</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label">Kategori</label>
            <select class="form-select bg-dark text-white border-secondary" id="kategori" required>
              <option value="HBG">HBG - Harta Bergerak</option>
              <option value="HTB">HTB - Harta Tidak Bergerak</option>
              <option value="HKI">HKI - Tak Berwujud / HKI</option>
            </select>
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label">Ruangan/Tempat</label>
            <select class="form-select bg-dark text-white border-secondary" id="tempat" required>
              <option value="GRJ">GRJ - Gedung Gereja</option>
              <option value="KST">KST - Konsistori</option>
              <option value="PST">PST - Pastori</option>
              <option value="GDL">GDL - Gedung Lainnya</option>
              <option value="KNT">KNT - Kantor</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label">Tahun Perolehan</label>
            <input type="number" class="form-control bg-dark text-white border-secondary" id="tahun" value="2026" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Kondisi Barang</label>
          <select class="form-select bg-dark text-white border-secondary" id="kondisi" required>
            <option value="Baik">Baik (Berfungsi 100%)</option>
            <option value="Perlu Perbaikan">Perlu Perbaikan / Servis</option>
            <option value="Rusak Berat">Rusak Berat</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Upload Foto Barang (Max 50MB)</label>
          <input type="file" class="form-control bg-dark text-white border-secondary" id="fotoBarang" accept="image/*" capture="environment" required>
          <small class="text-muted">Bisa langsung ambil foto lewat kamera HP.</small>
        </div>

        <button type="submit" class="btn btn-gold w-100 py-2 mt-2">Simpan & Generate Kode BSA</button>
      </form>
    </div>

  </div>

</body>
</html>
