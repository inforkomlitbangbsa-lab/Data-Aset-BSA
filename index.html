<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Inventaris Aset Baru</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0d1117; color: #f0f6fc; padding: 20px; }
    .card { background-color: #161b22; border-color: #30363d; color: #f0f6fc; }
    .form-control, .form-select { background-color: #0d1117; color: #f0f6fc; border-color: #30363d; }
    .form-control:focus, .form-select:focus { background-color: #161b22; color: #fff; }
    .btn-gold { background-color: #8c6d1f; color: #fff; font-weight: bold; }
    .btn-gold:hover { background-color: #a38025; color: #fff; }
  </style>
</head>
<body>

<div class="container my-4" style="max-width: 500px;">
  <h4 class="text-center mb-4 text-warning">Input Inventaris Aset Baru</h4>
  
  <form id="formAset" class="card p-4 shadow">
    <div class="mb-3">
      <label class="form-label">Nama Barang</label>
      <input type="text" id="namaBarang" class="form-control" placeholder="Contoh: Kursi" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Lokasi</label>
      <input type="text" id="lokasi" class="form-control" placeholder="Contoh: IND" value="IND" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Kategori</label>
      <input type="text" id="kategori" class="form-control" placeholder="Contoh: HBG" value="HBG" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Tempat</label>
      <input type="text" id="tempat" class="form-control" placeholder="Contoh: GRJ" value="GRJ" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Tahun</label>
      <input type="number" id="tahun" class="form-control" value="2026" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Kondisi</label>
      <select id="kondisi" class="form-select">
        <option value="Baik" selected>Baik</option>
        <option value="Perlu Perbaikan">Perlu Perbaikan</option>
        <option value="Rusak">Rusak</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Foto Aset</label>
      <input type="file" id="fotoFile" class="form-control" accept="image/*">
    </div>

    <button type="submit" id="btnSubmit" class="btn btn-gold w-100 py-2">
      Simpan Data Aset
    </button>
  </form>
</div>

<!-- Modal Loading Indikator (Elemen Modal Bootstrap) -->
<div class="modal fade" id="loadingModal" tabindex="-1" data-bs-backdrop="static" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-body text-center py-4">
        <div class="spinner-border text-warning mb-3" role="status"></div>
        <p class="mb-0">Sedang Menyimpan Data & Upload Foto...</p>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
  const SCRIPT_URL = "GANTI_DENGAN_URL_WEB_APP_GOOGLE_APPS_SCRIPT_ANDA";

  const formAset = document.getElementById('formAset');
  const btnSubmit = document.getElementById('btnSubmit');
  
  // Inisialisasi Modal Bootstrap secara aman
  const loadingModalEl = document.getElementById('loadingModal');
  const loadingModal = new bootstrap.Modal(loadingModalEl);

  formAset.addEventListener('submit', function(e) {
    e.preventDefault();

    // 1. Ambil nilai dari form
    const namaBarang = document.getElementById('namaBarang').value.trim();
    const lokasi     = document.getElementById('lokasi').value.trim();
    const kategori   = document.getElementById('kategori').value.trim();
    const tempat     = document.getElementById('tempat').value.trim();
    const tahun      = document.getElementById('tahun').value.trim();
    const kondisi    = document.getElementById('kondisi').value;

    // Validasi Sederhana
    if (!namaBarang) {
      alert("Nama barang wajib diisi!");
      return;
    }

    // 2. Tampilkan Loading Modal
    loadingModal.show();
    btnSubmit.disabled = true;

    // 3. Susun data JSON
    const payload = {
      namaBarang: namaBarang,
      lokasi: lokasi || "IND",
      kategori: kategori || "HBG",
      tempat: tempat || "GRJ",
      tahun: tahun || "2026",
      kondisi: kondisi,
      fotoUrl: "" // Tambahkan logic upload Drive di sini jika ada
    };

    // 4. Kirim data ke Google Apps Script
    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(res => {
      // Sembunyikan Modal Loading
      loadingModal.hide();
      btnSubmit.disabled = false;

      if (res.status === 'success') {
        alert("Berhasil! " + res.message + "\nKode Aset: " + res.kodeBSA);
        formAset.reset();
      } else {
        alert("Gagal menyimpan data: " + res.message);
      }
    })
    .catch(err => {
      // Sembunyikan Modal Loading saat Terjadi Error
      loadingModal.hide();
      btnSubmit.disabled = false;
      alert("Gagal mengirim data: " + err.message);
    });
  });
</script>
</body>
</html>
